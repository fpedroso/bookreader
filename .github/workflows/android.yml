name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The dictionary is not committed (CC-CEDICT is CC BY-SA and 16 MB), so the
      # build has to reproduce it from upstream. This also exercises build_cedict.py.
      - name: Build CC-CEDICT asset
        run: |
          set -euo pipefail
          pip install --quiet pypinyin jieba
          curl -sSL -o tools/cedict.gz \
            "https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz"
          gzip -dc tools/cedict.gz > tools/cedict.txt
          python tools/build_cedict.py
          test -f app-android/app/src/main/assets/cedict.db

      # Generate the fixtures the extractor-agreement test needs. They are not
      # committed either, so without this the test would silently skip.
      - name: Generate test fixtures
        run: |
          set -euo pipefail
          python tools/gen_hsk1.py content/hsk1.epub
          python tools/annotate.py content/hsk1.epub tools/cedict.txt content/hsk1.pinyin.json

      # Do NOT use android-actions/setup-android@v3: it runs `sdkmanager tools`, and
      # the legacy 'tools' package was removed from the SDK repository, so the action
      # fails with "Failed to find package 'tools'" before doing anything useful.
      # Locate sdkmanager ourselves (it is not on PATH by default) and install exactly
      # what build.gradle.kts asks for: it pins buildToolsVersion to 35.0.1 because
      # AGP 8.6.1 would otherwise default to 34.0.0.
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          echo "sdkmanager: $MGR"
          test -n "$MGR"
          yes | "$MGR" --licenses >/dev/null 2>&1 || true
          "$MGR" --install "platforms;android-35" "build-tools;35.0.1"
          echo "--- installed ---"
          "$MGR" --list_installed 2>/dev/null | grep -E "android-35|35\.0\.1|build-tools" || true

      - uses: gradle/actions/setup-gradle@v4

      # Proves the Python annotator and the Kotlin parser still agree: this is the
      # load-bearing assumption of the whole design, so it must not silently skip.
      - name: Unit tests (extractor agreement)
        working-directory: app-android
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon
          # Fails on a SKIPPED test too: the test skips when fixtures are missing,
          # which would otherwise look like a pass.
          python ../tools/check_test_results.py

      - name: Build debug APK
        working-directory: app-android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
