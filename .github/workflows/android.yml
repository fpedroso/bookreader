name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than ubuntu-latest: the label migrates to Ubuntu 26 on
    # 2026-10-19, and a silent base-image change should not be what breaks a build.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the version name is the commit count, and a shallow clone would
          # report 1 for every build.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Do NOT use android-actions/setup-android@v3: it runs `sdkmanager tools`, and
      # the legacy 'tools' package was removed from the SDK repository, so the action
      # fails with "Failed to find package 'tools'" before doing anything useful.
      # Locate sdkmanager ourselves (it is not on PATH by default) and install exactly
      # what build.gradle.kts asks for: it pins buildToolsVersion to 35.0.1 because
      # AGP 8.6.1 would otherwise default to 34.0.0.
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          echo "sdkmanager: $MGR"
          test -n "$MGR"
          yes | "$MGR" --licenses >/dev/null 2>&1 || true
          "$MGR" --install "platforms;android-35" "build-tools;35.0.1"
          echo "--- installed ---"
          "$MGR" --list_installed 2>/dev/null | grep -E "android-35|35\.0\.1|build-tools" || true

      # setup-gradle annotates "Gradle X is out of date" against the latest MAJOR, not
      # the latest 8.x - it still fires on 8.14.6, the newest 8.x release. Clearing it
      # means Gradle 9.x, which requires AGP 9.x, which requires compileSdk 37; the
      # machine has android-35 only and no cmdline-tools. Tolerated deliberately: it is
      # a "you could be newer" nudge, not a defect. See the SDK pin note above.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: app-android
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon
          # Fails on a SKIPPED test too, which would otherwise look like a pass.
          python ../tools/check_test_results.py

      - name: Build debug APK
        working-directory: app-android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
